[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "rag-litellm-gateway"
version = "0.1.0"
description = "RAG app — Phase 1: Basic RAG with ChromaDB + HuggingFace + OpenAI"
requires-python = ">=3.11"
dependencies = [
    # API
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-multipart>=0.0.9",

    # Embeddings — FREE, runs locally, no API key
    "sentence-transformers>=3.0.0",

    # Vector store — FREE, local
    "chromadb>=0.5.0",

    # Document loaders
    "pypdf>=4.0.0",
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.0",

    # Text splitting
    "langchain-text-splitters>=0.2.0",

    # OpenAI — only paid part
    "openai>=1.35.0",

    # Utils
    "python-dotenv>=1.0.0",
    "structlog>=24.1.0",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]